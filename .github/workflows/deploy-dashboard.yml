name: Render and deploy Kindle dashboard

on:
  push:
    branches: [main]
    paths:
      - "dashboard/**"
      - ".github/workflows/deploy-dashboard.yml"
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: kindle-dashboard-pages
  cancel-in-progress: true

jobs:
  render-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install CJK font
        run: sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: dashboard/requirements.txt

      - name: Install renderer dependencies
        run: pip install -r dashboard/requirements.txt

      - name: Render dashboard
        env:
          ICAL_URL: ${{ secrets.ICAL_URL }}
          DASHBOARD_SLUG: ${{ secrets.DASHBOARD_SLUG }}
          OUTPUT_DIR: public
        run: |
          test -n "$ICAL_URL"
          test -n "$DASHBOARD_SLUG"
          python dashboard/render_dashboard.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
